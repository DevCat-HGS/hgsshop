version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must move together: a mismatch crashes the app on load (React error #527).
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
