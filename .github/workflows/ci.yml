name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # tsc -b typechecks before Vite builds; the build also writes 404.html and sitemap.xml.
      - name: Typecheck and build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Desktop and mobile viewports; Playwright starts the dev server itself (playwright.config.ts).
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the Playwright report when e2e fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
